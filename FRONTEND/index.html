<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="application-version" content="1.3.0" />
    <title>PETC Inventory & Viewing System</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        background-color: #0f172a;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
      }
      /* Smooth global micro-interactions */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scroll-behavior: smooth;
      }
      button, a, input, [role="button"] {
        touch-action: manipulation;
      }
      [role="button"], button {
        transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), 
                    filter 0.15s ease, 
                    box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      [role="button"]:hover, button:hover {
        filter: brightness(1.06);
      }
      [role="button"]:active, button:active {
        transform: scale(0.97) !important;
      }

      /* High Performance GPU-Accelerated Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideInLeft {
        from {
          transform: translate3d(-100%, 0, 0);
          opacity: 0.85;
        }
        to {
          transform: translate3d(0, 0, 0);
          opacity: 1;
        }
      }

      @keyframes modalSlideUp {
        0% {
          opacity: 0;
          transform: translate3d(0, 24px, 0) scale(0.96);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes toastSlideIn {
        0% {
          opacity: 0;
          transform: translate3d(0, -24px, 0) scale(0.92);
        }
        60% {
          opacity: 1;
          transform: translate3d(0, 3px, 0) scale(1.02);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes accordionDown {
        from {
          opacity: 0;
          transform: translate3d(0, -8px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes scannerLaser {
        0% {
          top: 6%;
          opacity: 0.75;
        }
        50% {
          opacity: 1;
        }
        100% {
          top: 92%;
          opacity: 0.75;
        }
      }

      @keyframes pulseGlow {
        0% {
          box-shadow: 0 8px 24px rgba(5, 150, 105, 0.45);
        }
        50% {
          box-shadow: 0 10px 30px rgba(5, 150, 105, 0.75);
          transform: scale(1.02);
        }
        100% {
          box-shadow: 0 8px 24px rgba(5, 150, 105, 0.45);
        }
      }

      /* Custom scrollbars for clean UI */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      /* Light mode global overrides */
      html.light-theme, body.light-theme, #root.light-theme {
        background-color: #f1f5f9;
        color: #0f172a;
      }
      .light-theme ::-webkit-scrollbar-track {
        background: #e2e8f0;
      }
      .light-theme ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
      }
      .light-theme ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
